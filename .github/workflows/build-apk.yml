name: Build LYNSER APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: |
          mkdir extracted
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP"
          unzip -o "$ZIP" -d extracted

      - name: Locate Gradle Project
        run: |
          SETTINGS=$(find extracted -name settings.gradle.kts -print -quit)
          test -n "$SETTINGS"
          PROJECT_DIR=$(dirname "$SETTINGS")
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" output/LYNSER.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LYNSER-APK
          path: output/LYNSER.apk
